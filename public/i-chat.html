
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com James</title>
    <link rel="stylesheet" href="m-style-chat.css">
</head>
<body>
    <nav class="menu">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="i-galeria.html">Galeria</a>
        <a class="link" href="i-chat.html">Chat</a>
        <a class="link" href="i-login.html">Log-in</a>
        <a class="link" href="i-cadastro.html">Cadastro</a>
    </nav>

    <div class="chatContainer">
        <h2 id="boasVindas">Seja bem vindo ao Chat</h2>
        <div id="caixaChat"></div>

        <div id="inputArea">
            <input type="text" id="mensagem" placeholder="Digite sua mensagem">
            <button id="btnEnviar">Enviar</button>
        </div>
    </div>

    <script>
        // Verifica se o usuário está logado
        if (localStorage.getItem('usuarioLogado') !== 'true') {
            alert('Você precisa fazer login para acessar o chat!');
            window.location.href = 'i-cadastro.html';
        }

        // Recupera o nome do usuário
        const nomeUsuario = localStorage.getItem('usuarioEntrada');

        document.querySelector('#boasVindas').textContent =
            `Olá ${nomeUsuario}, seja bem vindo`;

        const caixaChat = document.querySelector('#caixaChat');
        const inputMensagem = document.querySelector('#mensagem');
        const btnEnviar = document.querySelector('#btnEnviar');

        const historicoConversa = [];

        function mensagemTela(autor, texto) {
            const textoFinal = document.createElement('p');
            textoFinal.className = 'msg';
            textoFinal.textContent = `${autor}: ${texto}`;
            caixaChat.appendChild(textoFinal);

            caixaChat.scrollTop = caixaChat.scrollHeight;
        }

        btnEnviar.addEventListener('click', async () => {
            const textoMensagem = inputMensagem.value.trim();

            if (!textoMensagem) return;

            mensagemTela(nomeUsuário, textoMensagem);

            historicoConversa.push({
                role: "user",
                content: textoMensagem
            });

            inputMensagem.value = '';
            btnEnviar.disabled = true;

            try {
                const respostaServidor = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        historico: historicoConversa
                    })
                });

                const dados = await respostaServidor.json();

                if (!respostaServidor.ok) {
                    mensagemTela('Sistema', dados.erro || 'Erro desconhecido no servidor');
                    return;
                }

                mensagemTela('James', dados.resposta);

                historicoConversa.push({
                    role: "assistant",
                    content: dados.resposta
                });

            } catch (erro) {
                mensagemTela('Sistema', 'Erro ao conectar com o servidor');
            } finally {
                btnEnviar.disabled = false;
                inputMensagem.focus();
            }
        });

        inputMensagem.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnEnviar.click();
            }
        });
    </script>
</body>
</html>
